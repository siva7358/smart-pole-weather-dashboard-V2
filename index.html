<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puducherry Weather Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:'Montserrat',sans-serif;
    color:white;
    background:linear-gradient(135deg,#074100,#030041,#074100);
}

/* MAIN CONTAINER */
.container{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* ================= TOP PANEL ================= */

.topPanel{
    height:35%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,.15);
}

#clock{
    font-size:15vw;
    font-weight:900;
}

#day{
    font-size:10vw;
    margin-top:10px;
}

#date{
    font-size:10vw;
    margin-top:10px;
}

/* ================= WEATHER PANEL ================= */

.weatherPanel{
    height:65%;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.weatherCard{
    width:100%;
    height:100%;
    max-width:900px;
    border-radius:0px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;

    background:rgba(255,255,255,.12);
    backdrop-filter:blur(40px);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

/* VALUE */
#slideValue{
    font-size:17vw;
    font-weight:900;
    line-height:1;
    text-shadow:0 0 25px rgba(255,255,255,.35);
}

/* DESCRIPTION */
#slideDesc{
    font-size:10vw;
    font-weight:600;
    margin-top:30px;
    opacity:0.95;
}

/* HIDDEN TITLE */
#slideTitle{
    display:none;
}

/* ANIMATION */
.fade{
    animation:fade 0.8s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- TOP -->
    <div class="topPanel">
        <div id="clock">--:--</div>
        <div id="day">Loading...</div>
        <div id="date">Loading...</div>
    </div>

    <!-- WEATHER -->
    <div class="weatherPanel">
        <div class="weatherCard fade" id="weatherCard">

            <div id="slideValue">--</div>

            <div id="slideDesc">Fetching Weather...</div>

        </div>
    </div>

</div>

<script>

const apiKey = "3e7057db50b0f5232d0d5fae6b9bec8f";
const city = "Puducherry";

let slides = [];
let slideIndex = 0;

/* CLOCK */
function updateClock(){
    const now = new Date();

    document.getElementById("clock").innerText =
    now.toLocaleTimeString('en-US',{
        hour:'2-digit',
        minute:'2-digit',
        hour12:true
    });

    document.getElementById("day").innerText =
    now.toLocaleDateString('en-US',{weekday:'long'});

    document.getElementById("date").innerText =
    now.toLocaleDateString('en-US',{
        day:'2-digit',
        month:'long',
        year:'numeric'
    });
}

/* AQI */
function getHealthAdvice(aqi){
    switch(aqi){
        case 1: return "Good Air Quality";
        case 2: return "Fair Air Quality";
        case 3: return "Moderate Air Quality";
        case 4: return "Poor Air Quality";
        case 5: return "Very Poor Air Quality";
        default: return "";
    }
}

/* SLIDES */
function rotateSlides(){

    if(slides.length===0) return;

    const slide = slides[slideIndex];

    const card = document.getElementById("weatherCard");
    card.classList.remove("fade");
    void card.offsetWidth;
    card.classList.add("fade");

    document.getElementById("slideValue").innerText = slide.value;
    document.getElementById("slideDesc").innerText = slide.desc;

    slideIndex = (slideIndex + 1) % slides.length;
}

/* WEATHER */
async function getWeather(){

    try{

        const res = await fetch(
        `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`
        );

        const data = await res.json();

        const temp = Math.round(data.main.temp);
        const humidity = data.main.humidity;
        const wind = Math.round(data.wind.speed);
        const visibility = (data.visibility/1000).toFixed(1);

        const lat = data.coord.lat;
        const lon = data.coord.lon;

        const aqiRes = await fetch(
        `https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${apiKey}`
        );

        const aqiData = await aqiRes.json();
        const aqi = aqiData.list[0].main.aqi;

        const sunrise = new Date(data.sys.sunrise * 1000)
        .toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});

        const sunset = new Date(data.sys.sunset * 1000)
        .toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});

        slides = [
            {value: temp+"°C", desc: data.weather[0].description},
            {value: "AQI "+aqi, desc: getHealthAdvice(aqi)},
            {value: humidity+"%", desc: "Humidity"},
            {value: wind+" km/h", desc: "Wind Speed"},
            {value: visibility+" km", desc: "Visibility"},
            {value: sunrise, desc: "Sunrise"},
            {value: sunset, desc: "Sunset"}
        ];

        rotateSlides();

    }catch(error){
        console.log("Weather Error:", error);
    }
}

/* START */
updateClock();
getWeather();

setInterval(updateClock,1000);
setInterval(rotateSlides,5000);
setInterval(getWeather,60000);

</script>

</body>
</html>
