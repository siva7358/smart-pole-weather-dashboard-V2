<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard 1280x2560</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:1280px;
    height:2560px;
    overflow:hidden;
    font-family:Arial, sans-serif;
    color:white;
    background:linear-gradient(135deg,#074100,#030041,#074100);
}

/* MAIN CONTAINER */
.container{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* ================= TOP PANEL ================= */

.topPanel{
    height:30%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    border-bottom:2px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
}

#clock{
    font-size:140px;
    font-weight:900;
}

#day{
    font-size:70px;
    font-weight:700;
    margin-top:10px;
}

#date{
    font-size:50px;
    font-weight:500;
    margin-top:10px;
}

/* ================= WEATHER PANEL ================= */

.weatherPanel{
    height:70%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.weatherCard{
    width:100%;
    height:100%;
    border-radius:40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(40px);

    border:2px solid rgba(255,255,255,0.2);
    box-shadow:0 40px 120px rgba(0,0,0,0.4);
}

/* SLIDES TEXT */

#slideTitle{
    font-size:90px;
    font-weight:700;
    letter-spacing:4px;
    text-transform:uppercase;
}

#slideValue{
    font-size:180px;
    font-weight:900;
    margin-top:20px;
    text-shadow:0 0 30px rgba(255,255,255,0.3);
}

#slideDesc{
    font-size:70px;
    font-weight:600;
    margin-top:30px;
    opacity:0.9;
}

/* ANIMATION */
.fade{
    animation:fade 0.8s ease;
}

@keyframes fade{
    from{opacity:0; transform:scale(1.05);}
    to{opacity:1; transform:scale(1);}
}

</style>
</head>

<body>

<div class="container">

    <!-- TOP CLOCK -->
    <div class="topPanel">
        <div id="clock">--:--</div>
        <div id="day">Loading...</div>
        <div id="date">Loading...</div>
    </div>

    <!-- WEATHER -->
    <div class="weatherPanel">
        <div class="weatherCard fade" id="weatherCard">

            <div id="slideTitle">Loading...</div>
            <div id="slideValue">--</div>
            <div id="slideDesc">Fetching Weather...</div>

        </div>
    </div>

</div>

<script>

const apiKey = "3e7057db50b0f5232d0d5fae6b9bec8f";
const city = "Puducherry";

let slides = [];
let slideIndex = 0;

/* CLOCK */
function updateClock(){
    const now = new Date();

    document.getElementById("clock").innerText =
    now.toLocaleTimeString('en-US',{
        hour:'2-digit',
        minute:'2-digit',
        hour12:true
    });

    document.getElementById("day").innerText =
    now.toLocaleDateString('en-US',{weekday:'long'});

    document.getElementById("date").innerText =
    now.toLocaleDateString('en-US',{
        day:'2-digit',
        month:'long',
        year:'numeric'
    });
}

/* SLIDES */
function rotateSlides(){

    if(slides.length === 0) return;

    const slide = slides[slideIndex];

    const card = document.getElementById("weatherCard");
    card.classList.remove("fade");
    void card.offsetWidth;
    card.classList.add("fade");

    document.getElementById("slideTitle").innerText = slide.title;
    document.getElementById("slideValue").innerText = slide.value;
    document.getElementById("slideDesc").innerText = slide.desc;

    slideIndex = (slideIndex + 1) % slides.length;
}

/* WEATHER API */
async function getWeather(){

    try{

        const res = await fetch(
        `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`
        );

        const data = await res.json();

        const temp = Math.round(data.main.temp);
        const humidity = data.main.humidity;
        const wind = Math.round(data.wind.speed);
        const visibility = (data.visibility/1000).toFixed(1);

        const lat = data.coord.lat;
        const lon = data.coord.lon;

        const aqiRes = await fetch(
        `https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${apiKey}`
        );

        const aqiData = await aqiRes.json();
        const aqi = aqiData.list[0].main.aqi;

        const sunrise = new Date(data.sys.sunrise * 1000)
        .toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});

        const sunset = new Date(data.sys.sunset * 1000)
        .toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});

        slides = [
            {title:"TEMPERATURE", value:temp+"°C", desc:data.weather[0].description},
            {title:"AIR QUALITY", value:"AQI "+aqi, desc:"Index Level"},
            {title:"HUMIDITY", value:humidity+"%", desc:"Relative Humidity"},
            {title:"WIND SPEED", value:wind+" km/h", desc:"Wind Condition"},
            {title:"VISIBILITY", value:visibility+" km", desc:"Clear View"},
            {title:"SUNRISE", value:sunrise, desc:"Morning Time"},
            {title:"SUNSET", value:sunset, desc:"Evening Time"}
        ];

        rotateSlides();

    }catch(err){
        console.log(err);
    }
}

/* START */
updateClock();
getWeather();

setInterval(updateClock,1000);
setInterval(rotateSlides,5000);
setInterval(getWeather,60000);

</script>

</body>
</html>
