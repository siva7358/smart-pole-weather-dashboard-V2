<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=96, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>96x192 · AQI</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#05080A;
  --bg2:#0A1113;
  --line:rgba(45,212,191,.22);
  --line-dim:rgba(255,255,255,.06);
  --text:#EAF3F0;
  --text-dim:#9CB8B3;
  --text-dimmer:#6E8985;
  --cyan:#2DD4BF;
  --amber:#FFB300;
  --c-good:#34D399;
  --c-moderate:#FDE047;
  --c-sensitive:#FB923C;
  --c-unhealthy:#F87171;
  --c-very:#C084FC;
  --c-hazard:#EF4444;
  --accent: var(--c-good);
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  width:96px;
  height:192px;
  overflow:hidden;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0px, rgba(255,255,255,.028) 1px, transparent 1px, transparent 12px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.028) 0px, rgba(255,255,255,.028) 1px, transparent 1px, transparent 12px),
    radial-gradient(ellipse 90% 60% at 50% 0%, rgba(45,212,191,.05), transparent 60%),
    linear-gradient(160deg, var(--bg), var(--bg2) 55%, var(--bg));
  color:var(--text);
  font-family:'Roboto Mono',monospace;
  image-rendering:crisp-edges;
}

.stage{
  width:96px;
  height:192px;
  display:flex;
  flex-direction:column;
  padding:2px 3px;
  gap:2px;
}

/* ============ HEADER ============ */

.header{
  display:flex;
  flex-direction:column;
  padding-bottom:1px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
  height:28px;
}

.brand{
  display:flex;
  flex-direction:column;
  gap:0px;
}

.brand .stnRow{
  display:flex;
  align-items:center;
  gap:4px;
}

.brand .stnId{
  font-family:'Roboto Mono',monospace;
  font-weight:700;
  font-size:5px;
  letter-spacing:.12em;
  color:var(--cyan);
  border:1px solid var(--line);
  padding:1px 3px;
  line-height:8px;
}

.brand .coords{
  font-family:'Roboto Mono',monospace;
  font-size:4px;
  letter-spacing:.06em;
  color:var(--text-dimmer);
}

.brand .city{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:11px;
  letter-spacing:-.01em;
  line-height:1.1;
  margin-top:-1px;
}

.status-clock{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:0px;
}

.status{
  display:flex;
  align-items:center;
  gap:3px;
  font-family:'Roboto Mono',monospace;
  font-weight:600;
  font-size:4.5px;
  color:var(--text-dim);
  letter-spacing:.08em;
  text-transform:uppercase;
}

.status .dot{
  width:5px;
  height:5px;
  background:var(--accent);
  box-shadow:0 0 5px var(--accent);
  transition:background .6s ease, box-shadow .6s ease;
}

.status.offline .dot{
  background:var(--text-dimmer);
  box-shadow:none;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:.2;}
}

#clock{
  font-family:'Roboto Mono',monospace;
  font-weight:700;
  font-size:9px;
  line-height:1;
  letter-spacing:-.01em;
}

/* ============ HERO ============ */

.hero{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:2px;
  min-height:0;
}

.panel{
  background:rgba(255,255,255,.015);
  border:1px solid var(--line-dim);
  position:relative;
  overflow:hidden;
}

.panel::before, .panel::after,
.panel .brkA, .panel .brkB{
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  border-color:var(--cyan);
  border-style:solid;
  opacity:.35;
  z-index:2;
  pointer-events:none;
}

.panel::before{ top:-1px; left:-1px; border-width:1px 0 0 1px; }
.panel::after{ bottom:-1px; right:-1px; border-width:0 1px 1px 0; }
.panel .brkA{ top:-1px; right:-1px; border-width:1px 1px 0 0; }
.panel .brkB{ bottom:-1px; left:-1px; border-width:0 0 1px 1px; }

/* ---- gauge panel ---- */

.gaugePanel{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0px;
  padding:1px 0 0 0;
  flex:1.2;
}

.gaugeWrap{
  position:relative;
  width:100%;
  max-width:66px;
  z-index:1;
  flex-shrink:0;
}

#gaugeSvg{
  width:100%;
  display:block;
  overflow:visible;
}

.tick{
  stroke:var(--text-dimmer);
  stroke-width:1.5;
}

.tickMajor{
  stroke:var(--text-dim);
  stroke-width:2;
}

.needle{
  transition: transform 1s cubic-bezier(.4,0,.2,1);
  transform-origin: 200px 200px;
}

.gaugeReadout{
  position:relative;
  z-index:1;
  text-align:center;
  margin-top:-6px;
}

#aqiValue{
  font-family:'Roboto Mono',monospace;
  font-weight:700;
  font-size:18px;
  line-height:.9;
  transition:color .6s ease, text-shadow .6s ease;
}

#aqiCategory{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:5px;
  letter-spacing:.03em;
  text-transform:uppercase;
  margin-top:2px;
  transition:color .6s ease;
}

#aqiSub{
  font-family:'Roboto Mono',monospace;
  font-size:3.5px;
  color:var(--text-dim);
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-top:1px;
}

/* ---- stat panel ---- */

.statPanel{
  display:flex;
  flex-direction:column;
  padding:1px 2px;
  justify-content:center;
  gap:0px;
  flex:1;
}

.statLabel{
  display:flex;
  align-items:center;
  gap:4px;
  font-family:'Roboto Mono',monospace;
  font-weight:600;
  font-size:5px;
  letter-spacing:.2em;
  color:var(--cyan);
  text-transform:uppercase;
}

.statLabel::before{
  content:"";
  width:10px;
  height:1.5px;
  background:var(--cyan);
  flex-shrink:0;
}

#statValue{
  font-family:'Roboto Mono',monospace;
  font-weight:700;
  font-size:18px;
  line-height:1;
}

#statDesc{
  font-family:'Space Grotesk',sans-serif;
  font-weight:500;
  font-size:5px;
  color:var(--text-dim);
  text-transform:capitalize;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.dots{
  display:flex;
  gap:2px;
  margin-top:1px;
}

.dots span{
  width:8px;
  height:2px;
  background:var(--line-dim);
  transition:background .3s ease, width .3s ease;
}

.dots span.active{
  background:var(--accent);
  width:14px;
}

.fadeIn{
  animation:fadeIn .6s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(4px);}
  to{opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<div class="stage">

  <!-- HEADER -->
  <div class="header">
    <div class="brand">
      <div class="stnRow">
        <span class="stnId">STN·01</span>
        <span class="coords">11.9°N</span>
      </div>
      <div class="city">Puducherry</div>
    </div>
    <div class="status-clock">
      <div class="status" id="statusRow">
        <span class="dot"></span>
        <span id="statusText">Live</span>
      </div>
      <div id="clock">--:--</div>
    </div>
  </div>

  <!-- HERO -->
  <div class="hero">

    <!-- GAUGE -->
    <div class="panel gaugePanel">
      <span class="brkA"></span><span class="brkB"></span>
      <div class="gaugeWrap">
        <svg id="gaugeSvg" viewBox="0 0 400 240">
          <g id="gaugeTicks"></g>
          <g id="gaugeZones"></g>
          <line id="needle" class="needle" x1="200" y1="200" x2="200" y2="58" stroke="#EAF3F0" stroke-width="5" stroke-linecap="round"/>
          <circle cx="200" cy="200" r="8" fill="#EAF3F0"/>
          <circle cx="200" cy="200" r="8" fill="none" stroke="var(--cyan)" stroke-width="2"/>
        </svg>
        <div class="gaugeReadout">
          <div id="aqiValue">--</div>
          <div id="aqiCategory">Connecting</div>
          <div id="aqiSub">PM2.5 --</div>
        </div>
      </div>
    </div>

    <!-- ROTATING STATS -->
    <div class="panel statPanel">
      <span class="brkA"></span><span class="brkB"></span>
      <div class="statLabel" id="statLabel">Temperature</div>
      <div id="statValue" class="fadeIn">--</div>
      <div id="statDesc" class="fadeIn">Fetching data...</div>
      <div class="dots" id="dots"></div>
    </div>

  </div>

</div>

<script>

const apiKey = "3e7057db50b0f5232d0d5fae6b9bec8f";
const city = "Puducherry";

let stats = [];
let statIndex = 0;

/* ============ CLOCK ============ */

function updateClock(){
  const now = new Date();
  document.getElementById("clock").innerText = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});
}

/* ============ AQI GAUGE ============ */

const ZONES = [
  {from:0,   to:50,  color:"#34D399"},
  {from:50,  to:100, color:"#FDE047"},
  {from:100, to:150, color:"#FB923C"},
  {from:150, to:200, color:"#F87171"},
  {from:200, to:300, color:"#C084FC"},
  {from:300, to:500, color:"#EF4444"},
];

const CATS = [
  {max:50,  label:"Good", color:"#34D399"},
  {max:100, label:"Moderate", color:"#FDE047"},
  {max:150, label:"Sensitive", color:"#FB923C"},
  {max:200, label:"Unhealthy", color:"#F87171"},
  {max:300, label:"Very Unhealthy", color:"#C084FC"},
  {max:500, label:"Hazardous", color:"#EF4444"},
];

function polar(cx,cy,r,angleDeg){
  const a = angleDeg * Math.PI/180;
  return {x: cx + r*Math.cos(a), y: cy + r*Math.sin(a)};
}

function arcPath(cx,cy,r,startVal,endVal){
  const a1 = 180 + (startVal/500)*180;
  const a2 = 180 + (endVal/500)*180;
  const p1 = polar(cx,cy,r,a1);
  const p2 = polar(cx,cy,r,a2);
  const largeArc = (a2-a1) > 180 ? 1 : 0;
  return `M ${p1.x} ${p1.y} A ${r} ${r} 0 ${largeArc} 1 ${p2.x} ${p2.y}`;
}

function drawGaugeZones(){
  const g = document.getElementById("gaugeZones");
  g.innerHTML = "";
  ZONES.forEach(z=>{
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d", arcPath(200,200,158,z.from,z.to));
    path.setAttribute("stroke", z.color);
    path.setAttribute("stroke-width","20");
    path.setAttribute("fill","none");
    path.setAttribute("stroke-linecap","butt");
    path.setAttribute("opacity","0.85");
    g.appendChild(path);
  });
}

function drawGaugeTicks(){
  const g = document.getElementById("gaugeTicks");
  g.innerHTML = "";
  const cx=200, cy=200;
  for(let v=0; v<=500; v+=25){
    const major = v % 100 === 0;
    const a = (180 + (v/500)*180) * Math.PI/180;
    const rOuter = 186;
    const rInner = major ? 172 : 178;
    const x1 = cx + rInner*Math.cos(a), y1 = cy + rInner*Math.sin(a);
    const x2 = cx + rOuter*Math.cos(a), y2 = cy + rOuter*Math.sin(a);
    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",x1); line.setAttribute("y1",y1);
    line.setAttribute("x2",x2); line.setAttribute("y2",y2);
    line.setAttribute("class", major ? "tickMajor" : "tick");
    g.appendChild(line);
  }
}

function categoryFor(aqi){
  return CATS.find(c=>aqi<=c.max) || CATS[CATS.length-1];
}

function pm25ToAQI(pm){
  const bp = [
    [0.0,12.0,0,50],
    [12.1,35.4,51,100],
    [35.5,55.4,101,150],
    [55.5,150.4,151,200],
    [150.5,250.4,201,300],
    [250.5,350.4,301,400],
    [350.5,500.4,401,500],
  ];
  const c = Math.min(Math.max(pm,0),500.4);
  for(const [cl,ch,al,ah] of bp){
    if(c>=cl && c<=ch){
      return Math.round(((ah-al)/(ch-cl))*(c-cl)+al);
    }
  }
  return 500;
}

function updateGauge(aqi, pm25){
  const clamped = Math.min(aqi,500);
  const angle = (clamped/500)*180 - 90;
  document.getElementById("needle").style.transform = `rotate(${angle}deg)`;

  const cat = categoryFor(clamped);
  document.getElementById("aqiValue").innerText = aqi;
  document.getElementById("aqiValue").style.color = cat.color;
  document.getElementById("aqiValue").style.textShadow = `0 0 14px ${cat.color}55`;
  document.getElementById("aqiCategory").innerText = cat.label;
  document.getElementById("aqiCategory").style.color = cat.color;
  document.getElementById("aqiSub").innerText = `PM2.5 ${pm25} µg/m³`;

  document.documentElement.style.setProperty('--accent', cat.color);
}

/* ============ ROTATING STAT PANEL ============ */

function buildDots(){
  const wrap = document.getElementById("dots");
  wrap.innerHTML = "";
  stats.forEach((_,i)=>{
    const d = document.createElement("span");
    if(i===0) d.classList.add("active");
    wrap.appendChild(d);
  });
}

function rotateStats(){
  if(stats.length===0) return;
  const s = stats[statIndex];

  document.getElementById("statLabel").innerText = s.label;

  const val = document.getElementById("statValue");
  const desc = document.getElementById("statDesc");
  val.classList.remove("fadeIn"); void val.offsetWidth; val.classList.add("fadeIn");
  desc.classList.remove("fadeIn"); void desc.offsetWidth; desc.classList.add("fadeIn");

  val.innerText = s.value;
  desc.innerText = s.desc;

  document.querySelectorAll("#dots span").forEach((d,i)=>d.classList.toggle("active", i===statIndex));

  statIndex = (statIndex+1) % stats.length;
}

/* ============ STATUS ============ */

function setStatus(online){
  const row = document.getElementById("statusRow");
  const text = document.getElementById("statusText");
  row.classList.toggle("offline", !online);
  text.innerText = online ? "Live" : "Off";
}

/* ============ FETCH ============ */

async function getWeather(){
  try{
    const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`);
    if(!res.ok) throw new Error("weather fetch failed");
    const data = await res.json();

    const lat = data.coord.lat;
    const lon = data.coord.lon;

    const aqiRes = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${apiKey}`);
    if(!aqiRes.ok) throw new Error("aqi fetch failed");
    const aqiData = await aqiRes.json();
    const components = aqiData.list[0].components;

    const pm25 = components.pm2_5;
    const usAqi = pm25ToAQI(pm25);

    const temp = Math.round(data.main.temp);
    const feels = Math.round(data.main.feels_like);
    const humidity = data.main.humidity;
    const wind = Math.round(data.wind.speed * 3.6);
    const visibility = (data.visibility/1000).toFixed(1);
    const sunrise = new Date(data.sys.sunrise*1000).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});
    const sunset  = new Date(data.sys.sunset*1000).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});

    stats = [
      {label:"Temp", value: temp+"°C", desc: `${data.weather[0].description} · ${feels}°C`},
      {label:"Humid", value: humidity+"%", desc: "Relative humidity"},
      {label:"Wind", value: wind+" km/h", desc: `Dir ${data.wind.deg||0}°`},
      {label:"Vis", value: visibility+" km", desc: "Ground visibility"},
      {label:"Sunrise", value: sunrise, desc: "Sunrise time"},
      {label:"Sunset", value: sunset, desc: "Sunset time"},
    ];

    buildDots();
    updateGauge(usAqi, pm25.toFixed(1));
    setStatus(true);

  }catch(err){
    console.log("Fetch error:", err);
    setStatus(false);
  }
}

/* ============ INIT ============ */

drawGaugeTicks();
drawGaugeZones();
updateClock();
getWeather();

setInterval(updateClock, 1000);
setInterval(rotateStats, 6000);
setInterval(getWeather, 60000);

</script>

</body>
</html>
